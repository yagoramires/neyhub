<!doctype html>
<!-- Ícone do NeyHub: "ney" branco sobre "hub" verde-limão, empilhados, na fonte do sistema (a do app), fundo grafite. -->
<!-- Canvas 1024 com o quadrado em 824 (grade de ícones do macOS). Gerar: scripts/icon.sh -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent}
.ic{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;
  background:linear-gradient(#202226,#121315);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:-apple-system,"SF Pro Display",sans-serif;font-weight:800;line-height:1;letter-spacing:-.03em}
.ney{color:#fff;font-size:240px}.hub{color:#c6ff3d;font-size:240px;margin-top:-4px}
</style></head><body><div class="ic"><span class="ney">ney</span><span class="hub">hub</span></div></body></html>
